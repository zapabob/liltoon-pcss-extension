name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Setup Pages
        uses: actions/configure-pages@v4
        
      - name: Build VPM Repository
        run: |
          # Copy VPM repository to build directory
          mkdir -p _site
          cp vpm.json _site/
          
          # Create README for GitHub Pages
          cat > _site/README.md << 'EOF'
          # lilToon PCSS Extension VPM Repository
          
          This is the VPM (VRChat Package Manager) repository for the lilToon PCSS Extension.
          
          ## Installation
          
          Add this repository to your VCC project:
          ```
          https://github.com/zapabob/liltoon-pcss-extension
          ```
          
          ## Latest Version
          
          Current version: **2.5.0**
          
          ## Features
          
          - Advanced Realistic Shadow System for lilToon
          - Modular Avatar AAO integration
          - Performance optimization for AMD/NVIDIA/Mobile/Quest GPUs
          - VRC Light Volumes 2.0.0 integration
          - lilToon 2.1.7 compatibility
          - Comprehensive error handling and auto-fix systems
          
          ## Documentation
          
          For detailed documentation, visit: https://github.com/zapabob/liltoon-pcss-extension
          
          EOF
          
          # Create directory structure for packages
          mkdir -p _site/packages/com.liltoon.pcss-extension
          
          # Generate package metadata
          echo "VPM Repository built successfully"
          
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4 